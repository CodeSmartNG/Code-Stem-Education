    <!-- =====================================================
         INITIAL LOADING SCREEN CSS
    ====================================================== -->
    <style>
      /* ===================================================
         GLOBAL RESET
      =================================================== */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;

        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;

        background:
          linear-gradient(
            135deg,
            #667eea 0%,
            #764ba2 100%
          );

        color: #ffffff;

        overflow-x: hidden;
      }

      #root {
        width: 100%;
        min-height: 100vh;
      }

      /* ===================================================
         INITIAL LOADING
      =================================================== */

      .initial-loading {
        position: relative;

        width: 100%;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        padding: 20px;
      }

      .initial-loading-container {
        position: relative;
        z-index: 10;

        width: 100%;
        max-width: 500px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 30px;

        animation: loadingFadeIn 0.6s ease-out;
      }

      /* ===================================================
         LOADING ICON
      =================================================== */

      .initial-loading-icon {
        width: 100px;
        height: 100px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 58px;

        margin-bottom: 25px;

        border-radius: 50%;

        background:
          rgba(255, 255, 255, 0.12);

        border:
          1px solid rgba(255, 255, 255, 0.18);

        box-shadow:
          0 15px 40px rgba(0, 0, 0, 0.15);

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        animation:
          loadingBounce 2s ease-in-out infinite;
      }

      /* ===================================================
         SPINNER
      =================================================== */

      .initial-loading-spinner {
        width: 48px;
        height: 48px;

        margin-bottom: 24px;

        border:
          4px solid rgba(255, 255, 255, 0.2);

        border-top-color: #ffffff;

        border-radius: 50%;

        animation:
          loadingSpin 0.8s linear infinite;
      }

      /* ===================================================
         TITLE
      =================================================== */

      .initial-loading-title {
        margin: 0 0 10px 0;

        font-size: 32px;

        line-height: 1.2;

        font-weight: 800;

        letter-spacing: -0.8px;

        background:
          linear-gradient(
            135deg,
            #ffffff 0%,
            #e0e7ff 50%,
            #ffffff 100%
          );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        background-clip: text;
      }

      /* ===================================================
         SUBTITLE
      =================================================== */

      .initial-loading-text {
        margin: 0;

        font-size: 15px;

        line-height: 1.6;

        font-weight: 400;

        color:
          rgba(255, 255, 255, 0.85);
      }

      /* ===================================================
         LOADING DOTS
      =================================================== */

      .initial-loading-dots {
        display: flex;

        gap: 6px;

        margin-top: 18px;
      }

      .initial-loading-dots span {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #ffffff;

        opacity: 0.3;

        animation:
          loadingDots 1.4s ease-in-out infinite;
      }

      .initial-loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .initial-loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      /* ===================================================
         PROGRESS BAR
      =================================================== */

      .initial-loading-progress {
        width: 260px;
        max-width: 80vw;

        height: 5px;

        margin-top: 24px;

        overflow: hidden;

        border-radius: 10px;

        background:
          rgba(255, 255, 255, 0.15);
      }

      .initial-loading-progress-bar {
        width: 0%;
        height: 100%;

        border-radius: inherit;

        background:
          linear-gradient(
            90deg,
            #818cf8,
            #c084fc,
            #f472b6
          );

        animation:
          loadingProgress 3s ease-in-out infinite;
      }

      /* ===================================================
         VERSION
      =================================================== */

      .initial-loading-version {
        margin-top: 22px;

        padding: 5px 14px;

        border-radius: 20px;

        font-size: 10px;

        letter-spacing: 1px;

        color:
          rgba(255, 255, 255, 0.55);

        background:
          rgba(255, 255, 255, 0.06);

        border:
          1px solid rgba(255, 255, 255, 0.08);
      }

      /* ===================================================
         BACKGROUND PARTICLES
      =================================================== */

      .loading-particles {
        position: absolute;

        inset: 0;

        pointer-events: none;

        overflow: hidden;
      }

      .loading-particle {
        position: absolute;

        width: 8px;
        height: 8px;

        border-radius: 50%;

        background:
          rgba(255, 255, 255, 0.12);

        animation:
          loadingFloat 8s ease-in-out infinite;
      }

      .loading-particle:nth-child(1) {
        top: 10%;
        left: 10%;
        width: 12px;
        height: 12px;
      }

      .loading-particle:nth-child(2) {
        top: 20%;
        right: 15%;
        width: 8px;
        height: 8px;
        animation-delay: 1s;
      }

      .loading-particle:nth-child(3) {
        bottom: 30%;
        left: 20%;
        width: 10px;
        height: 10px;
        animation-delay: 2s;
      }

      .loading-particle:nth-child(4) {
        bottom: 20%;
        right: 10%;
        width: 6px;
        height: 6px;
        animation-delay: 3s;
      }

      .loading-particle:nth-child(5) {
        top: 50%;
        left: 5%;
        width: 14px;
        height: 14px;
        animation-delay: 4s;
      }

      .loading-particle:nth-child(6) {
        top: 60%;
        right: 5%;
        width: 8px;
        height: 8px;
        animation-delay: 5s;
      }

      .loading-particle:nth-child(7) {
        bottom: 10%;
        left: 50%;
        width: 10px;
        height: 10px;
        animation-delay: 6s;
      }

      .loading-particle:nth-child(8) {
        top: 40%;
        left: 50%;
        width: 6px;
        height: 6px;
        animation-delay: 7s;
      }

      /* ===================================================
         ANIMATIONS
      =================================================== */

      @keyframes loadingSpin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @keyframes loadingBounce {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-12px);
        }
      }

      @keyframes loadingFadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loadingDots {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }

        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      @keyframes loadingProgress {
        0% {
          width: 0%;
        }

        30% {
          width: 35%;
        }

        60% {
          width: 70%;
        }

        100% {
          width: 100%;
        }
      }

      @keyframes loadingFloat {
        0%,
        100% {
          transform:
            translate(0, 0)
            scale(1);
        }

        25% {
          transform:
            translate(30px, -20px)
            scale(1.2);
        }

        50% {
          transform:
            translate(-20px, 30px)
            scale(0.8);
        }

        75% {
          transform:
            translate(20px, 10px)
            scale(1.1);
        }
      }

      /* ===================================================
         MOBILE
      =================================================== */

      @media (max-width: 768px) {
        .initial-loading-container {
          padding: 20px;
        }

        .initial-loading-icon {
          width: 85px;
          height: 85px;

          font-size: 48px;
        }

        .initial-loading-title {
          font-size: 26px;
        }

        .initial-loading-spinner {
          width: 42px;
          height: 42px;
        }

        .initial-loading-progress {
          width: 220px;
        }
      }

      @media (max-width: 480px) {
        .initial-loading-icon {
          width: 75px;
          height: 75px;

          font-size: 42px;
        }

        .initial-loading-title {
          font-size: 22px;
        }

        .initial-loading-text {
          font-size: 13px;
        }

        .initial-loading-spinner {
          width: 38px;
          height: 38px;

          border-width: 3px;
        }

        .initial-loading-progress {
          width: 180px;
        }

        .initial-loading-version {
          font-size: 8px;
        }
      }

      /* ===================================================
         DARK MODE
      =================================================== */

      @media (prefers-color-scheme: dark) {
        body {
          background:
            linear-gradient(
              135deg,
              #0f0c29 0%,
              #302b63 50%,
              #24243e 100%
            );
        }

        .initial-loading-spinner {
          border-color:
            rgba(255, 255, 255, 0.1);

          border-top-color:
            #818cf8;
        }

        .loading-particle {
          background:
            rgba(129, 140, 248, 0.12);
        }
      }

      /* ===================================================
         REDUCED MOTION
      =================================================== */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
