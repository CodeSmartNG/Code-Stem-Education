<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary Meta Tags -->
    <title>CodeSmartNG STEM - Interactive STEM Education Platform</title>

    <meta
      name="title"
      content="CodeSmartNG STEM - Interactive STEM Education Platform"
    />

    <meta
      name="description"
      content="CodeSmartNG STEM is an interactive education platform for students and teachers to learn programming, science, technology, engineering and mathematics."
    />

    <meta
      name="keywords"
      content="STEM education, programming, coding, Python, JavaScript, React, science, technology, engineering, mathematics, CodeSmartNG"
    />

    <meta name="author" content="CodeSmartNG" />

    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="CodeSmartNG STEM - Interactive STEM Education Platform"
    />

    <meta
      property="og:description"
      content="Interactive STEM education platform for students and teachers."
    />

    <meta
      property="og:url"
      content="https://your-vercel-domain.vercel.app/"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="CodeSmartNG STEM - Interactive STEM Education Platform"
    />

    <meta
      name="twitter:description"
      content="Interactive STEM education platform for students and teachers."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E"
    />

    <!--
      IMPORTANT:
      Do NOT use:

      <base href="/Code-Stem-Education_system/" />

      because the application is also deployed on Vercel.
      Vite should handle asset paths using vite.config.js.
    -->

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }

      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;

        background: #f5f7fb;
        color: #111827;
      }

      /* =========================================
         INITIAL LOADING SCREEN
         ========================================= */

      .initial-loading {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
          linear-gradient(
            135deg,
            #667eea 0%,
            #764ba2 100%
          );

        z-index: 99999;
      }

      .initial-loading-content {
        text-align: center;
        color: white;
        padding: 30px;
      }

      .initial-loading-icon {
        font-size: 64px;
        margin-bottom: 20px;

        animation: initialBounce 1.8s ease-in-out infinite;
      }

      .initial-loading-title {
        margin: 0 0 10px;

        font-size: 28px;
        font-weight: 700;
      }

      .initial-loading-text {
        margin: 0 0 25px;

        font-size: 15px;
        opacity: 0.85;
      }

      .initial-loading-spinner {
        width: 45px;
        height: 45px;

        margin: 0 auto;

        border: 4px solid rgba(255, 255, 255, 0.25);
        border-top-color: white;

        border-radius: 50%;

        animation: initialSpin 0.8s linear infinite;
      }

      @keyframes initialSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes initialBounce {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-10px);
        }
      }

      /* =========================================
         NOSCRIPT
         ========================================= */

      .noscript-message {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px;

        text-align: center;

        font-family: Arial, sans-serif;
      }

      .noscript-box {
        max-width: 500px;

        padding: 30px;

        background: white;

        border-radius: 15px;

        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .noscript-box h2 {
        margin-top: 0;
        color: #dc2626;
      }

      /* =========================================
         MOBILE
         ========================================= */

      @media (max-width: 600px) {
        .initial-loading-title {
          font-size: 23px;
        }

        .initial-loading-text {
          font-size: 14px;
        }

        .initial-loading-icon {
          font-size: 52px;
        }
      }

      /* =========================================
         REDUCED MOTION
         ========================================= */

      @media (prefers-reduced-motion: reduce) {
        .initial-loading-spinner,
        .initial-loading-icon {
          animation: none;
        }
      }
    </style>
  </head>

  <body>

    <!-- React mounts here -->
    <div id="root">

      <!-- Temporary loading screen.
           React will replace this content when App loads. -->

      <div class="initial-loading">
        <div class="initial-loading-content">

          <div class="initial-loading-icon">
            📚
          </div>

          <h1 class="initial-loading-title">
            CodeSmartNG STEM
          </h1>

          <p class="initial-loading-text">
            Loading your learning platform...
          </p>

          <div
            class="initial-loading-spinner"
            aria-label="Loading"
          ></div>

        </div>
      </div>

    </div>

    <noscript>
      <div class="noscript-message">
        <div class="noscript-box">
          <h2>JavaScript Required</h2>

          <p>
            CodeSmartNG STEM requires JavaScript to run.
            Please enable JavaScript in your browser and reload the page.
          </p>
        </div>
      </div>
    </noscript>

    <!--
      IMPORTANT:

      Vite automatically injects the correct JavaScript
      entry during development/build.

      Do not add a hard-coded script such as:

      <script src="/src/main.jsx"></script>

      unless you specifically need it.
    -->

  </body>
</html>
